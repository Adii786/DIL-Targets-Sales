<style>
  :root{
    --navy:#151515;
    --navy-2:#2A2A2A;
    --slate:#2A2A2A;
    --bg:#F7F6F0;
    --card:#FFFFFF;
    --line:#E7E2D2;
    --text:#1A1A1A;
    --muted:#736F60;
    --green:#1B8E5A;
    --green-bg:#E7F5EE;
    --red:#C0392B;
    --red-bg:#FBEAE8;
    --amber:#8A6D00;
    --amber-bg:#FFF3C4;
    --blue:#2A2A2A;
    --blue-bg:#ECEAE2;
    --brand:#8A6D00;
    --brand-bg:#FFE202;
    --brand-tint:#FFF3C4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{min-height:100vh;}
  input, select, button, textarea{ font-size:16px; font-family:inherit; }

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 15% 10%, rgba(255,226,2,0.14), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(255,226,2,0.08), transparent 50%),
    linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, #000 100%);}
  .login-logo{width:76px;height:76px;border-radius:16px;overflow:hidden;margin:0 0 18px;box-shadow:0 8px 20px rgba(0,0,0,0.18);}
  .login-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .login-card{background:var(--card);width:400px;max-width:90vw;border-radius:14px;padding:36px 32px;box-shadow:0 30px 60px rgba(10,15,30,0.35);}
  .login-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .login-title{font-size:21px;font-weight:700;margin:0 0 4px;color:var(--navy);}
  .login-sub{font-size:13px;color:var(--muted);margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px;}
  .field input, .field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;color:var(--text);background:#fff;}
  .field input:focus, select:focus{outline:none;border-color:var(--slate);}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:13px;cursor:pointer;transition:transform .08s ease, opacity .15s;min-height:46px;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--navy);color:#fff;width:100%;}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{background:transparent;color:var(--slate);border:1.5px solid var(--line);}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:6px;min-height:auto;}
  .err{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:7px;font-size:12.5px;margin-bottom:14px;font-weight:500;}
  .login-hint{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:14px;}

  /* ---------- Shell ---------- */
  .topbar{background:var(--navy);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--brand-bg);}
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-text .t1{font-size:13px;font-weight:700;letter-spacing:.02em;}
  .brand-text .t2{font-size:11px;color:#AEB9D4;}
  .top-right{display:flex;align-items:center;gap:14px;}

  .logout{color:#DCE3F5;font-size:12.5px;cursor:pointer;text-decoration:underline;background:none;border:none;}

  .tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--card);padding:5px;border-radius:10px;width:fit-content;border:1px solid var(--line);flex-wrap:wrap;}
  .tab{padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;}
  .tab.active{background:var(--navy);color:#fff;}

  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px;}

  .bottom-nav-row{display:flex;gap:4px;}
  .bottom-nav-item{
    flex:1;border:none;background:none;font-family:'Inter',sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 4px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;
  }
  .bottom-nav-item .ic{font-size:18px;line-height:1;}
  .bottom-nav-item.active{color:var(--navy);background:var(--brand-tint);}

  .loading{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
  .empty-note{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}
  .footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:30px;line-height:1.7;}

  .upload-box{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;cursor:pointer;background:#FBFBF8;}
  .upload-box:hover{border-color:var(--brand);}
  .upload-box input[type=file]{display:none;}

    .topbar{padding:12px 16px;}
    .container{padding:14px 12px 96px;}
    .tabs.desktop-tabs{display:none;}
    .bottom-nav{display:block;}
    .cards-row{grid-template-columns:repeat(2,1fr);}
    .stat-value{font-size:19px;}
    table.responsive-table thead{display:none;}

    table.responsive-table tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:#fff;}
    table.responsive-table td{border-bottom:none;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;}
    table.responsive-table td::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;}
    table.responsive-table td.num{text-align:right;}
    table.responsive-table tr.sku-subrow{background:#FBFCFE;}
  }
</style>

/* ============================= TOWN / RSM DATA ============================= */

/* ============================= STATE ============================= */
let state = {
  user:null,
  loginError:'',
  month:'2026-07',

  viewMode:'volume',          // volume | value

};

/* ============================= SESSION PERSISTENCE ============================= */
const SESSION_KEY = 'dil_tva_session_v1';
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      user: state.user, month: state.month, rsmView: state.rsmView,
      selectedTown: state.selectedTown, nsmView: state.nsmView
    }));

}
function restoreSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s.user) state.user = s.user;
    if(s.month) state.month = s.month;

}

/* ============================= HELPERS ============================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escJs(s){ return esc(s).replace(/'/g,"\\'"); }
function fmtQty(n){ n = Number(n)||0; return Math.round(n).toLocaleString('en-US'); }
function fmtPct(n){ if(!isFinite(n)) return '—'; return n.toFixed(0)+'%'; }
function achPct(target, achieved){ if(target<=0) return achieved>0?100:0; return (achieved/target)*100; }
function meterColor(pct){
  if(pct>=100) return 'var(--green)';
  if(pct>=60) return 'var(--blue)';
  if(pct>0) return 'var(--amber)';
  return '#D7DBE4';
}
function monthLabel(m){
  const [y,mo] = m.split('-');
  const d = new Date(Number(y), Number(mo)-1, 1);
  return d.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
}

/* ============================= DATA LAYER ============================= */
async function fetchFamilyAchievement(month, town, type){
  if(!sb) return [];
  type = type || 'primary';
  const {data, error} = await sb.from('monthly_achievement_family').select('*')
    .eq('month', month).eq('town', town).eq('type', type).order('family');
  if(error){ console.error(error); return []; }
  return data||[];
}
async function fetchSkuAchievement(month, town, type){
  if(!sb) return [];
  type = type || 'primary';
  const {data, error} = await sb.from('monthly_achievement_sku').select('*')
    .eq('month', month).eq('town', town).eq('type', type);
  if(error){ console.error(error); return []; }
  return data||[];
}
async function fetchSkuMeta(codes){
  if(!sb || !codes.length) return {};
  const {data, error} = await sb.from('product_hierarchy').select('sku_code,sku_name,price,uom').in('sku_code', codes);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.sku_code]={sku_name:r.sku_name, price:Number(r.price)||0, uom:r.uom||'PCS'});
  return map;
}
async function fetchTownData(month, town, type){
  const [famRows, skuRows] = await Promise.all([
    fetchFamilyAchievement(month, town, type),
    fetchSkuAchievement(month, town, type)
  ]);
  const skuCodes = [...new Set(skuRows.map(r=>r.sku_code))];
  const metaMap = await fetchSkuMeta(skuCodes);
  const byFamily = {};
  famRows.forEach(f=>{ byFamily[f.family] = { target:Number(f.target_qty)||0, achieved:Number(f.achieved_qty)||0, variance:Number(f.variance_qty!==undefined?f.variance_qty:f.variance)||0, achievedValue:0, hasPricing:false, skus:[] }; });
  skuRows.forEach(r=>{
    if(!byFamily[r.family]) byFamily[r.family] = {target:0, achieved:0, variance:0, achievedValue:0, hasPricing:false, skus:[]};
    const meta = metaMap[r.sku_code] || {sku_name:r.sku_code, price:0, uom:'PCS'};
    const qty = Number(r.qty)||0;
    const value = qty * meta.price;
    byFamily[r.family].skus.push({ sku_code:r.sku_code, sku_name: meta.sku_name, uom: meta.uom, price: meta.price, qty, value });
    byFamily[r.family].achievedValue += value;
    if(meta.price>0) byFamily[r.family].hasPricing = true;
  });
  // Estimate each family's target value using its own achieved blended price (qty-weighted avg selling price this month)
  Object.values(byFamily).forEach(f=>{
    f.avgPrice = f.achieved>0 ? f.achievedValue/f.achieved : 0;
    f.targetValueEst = f.avgPrice>0 ? f.target * f.avgPrice : 0;
  });
  return byFamily;
}
async function fetchTargetFamily(month, town){
  if(!sb) return {};
  const {data, error} = await sb.from('monthly_target_family').select('*').eq('month',month).eq('town',town);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.family]=Number(r.target_qty)||0);
  return map;
}
async function fetchOpeningStockFamily(month, town){
  if(!sb) return {};
  const {data, error} = await sb.from('opening_stock_family').select('*').eq('month',month).eq('town',town);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.family]=Number(r.qty)||0);
  return map;
}
function prevMonth(m){
  const [y,mo] = m.split('-').map(Number);
  const d = new Date(y, mo-2, 1); // mo-1 is current month index, -1 more for previous
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const SHORTFALL_CAP_RATIO = 1.0; // carried-forward shortfall capped at 100% of the new month's own target — ask Adnan before raising this

/* Suggested order = (this month's target + capped carry-forward shortfall from last month) − opening stock, floored at 0.
   Then split 50% / 25% / 25% across 3 supplies. */
async function computeSuggestedOrder(month, town){
  const prior = prevMonth(month);
  const [curTargets, priorAch, stock] = await Promise.all([
    fetchTargetFamily(month, town),
    fetchFamilyAchievement(prior, town, 'primary'),
    fetchOpeningStockFamily(month, town)
  ]);
  const priorMap = {};
  priorAch.forEach(r=> priorMap[r.family] = { target:Number(r.target_qty)||0, achieved:Number(r.achieved_qty)||0 });

  const families = new Set([...Object.keys(curTargets), ...Object.keys(priorMap)]);
  const rows = [];
  families.forEach(fam=>{
    const augTarget = curTargets[fam] || 0;
    const p = priorMap[fam];
    const rawShortfall = p ? Math.max(p.target - p.achieved, 0) : 0;
    const cappedShortfall = Math.min(rawShortfall, augTarget * SHORTFALL_CAP_RATIO);
    const openingStock = stock[fam] || 0;
    const suggested = Math.max(augTarget + cappedShortfall - openingStock, 0);
    const s1 = Math.round(suggested*0.5);
    const s2 = Math.round(suggested*0.25);
    const s3 = Math.max(suggested - s1 - s2, 0);
    rows.push({family:fam, augTarget, rawShortfall, cappedShortfall, openingStock, suggested, s1, s2, s3, hasStockData: fam in stock});
  });
  rows.sort((a,b)=> b.suggested - a.suggested);
  const stockUploaded = Object.keys(stock).length > 0;
  return {rows, stockUploaded, priorMonth:prior};
}

/* Builds the full view for one town: system suggestion merged with HO/RSM overrides. */
async function fetchFamilyBlendedPrices(month, town){
  const skuRows = await fetchSkuAchievement(month, town, 'primary');
  if(!skuRows.length) return {};
  const codes = [...new Set(skuRows.map(r=>r.sku_code))];
  const meta = await fetchSkuMeta(codes);
  const totals = {};
  skuRows.forEach(r=>{
    const price = (meta[r.sku_code]||{}).price || 0;
    const qty = Number(r.qty)||0;
    if(!totals[r.family]) totals[r.family] = {qty:0, value:0};
    totals[r.family].qty += qty;
    totals[r.family].value += qty*price;
  });
  const avg = {};
  Object.keys(totals).forEach(f=> avg[f] = totals[f].qty>0 ? totals[f].value/totals[f].qty : 0);
  return avg;
}

async function buildOrderPlanView(month, town){
  const prior = prevMonth(month);
  const [suggestedData, planMap, status, skuValueDetail, blendedPricesCur, blendedPricesPrior] = await Promise.all([
    computeSuggestedOrder(month, town),
    fetchOrderPlan(month, town),
    fetchOrderPlanStatus(month, town),
    fetchOrderPlanSkuValue(month, town),
    fetchFamilyBlendedPrices(month, town),
    fetchFamilyBlendedPrices(prior, town)
  ]);
  const rows = suggestedData.rows.map(r=>{
    const plan = planMap[r.family] || {hoQty:null, rsmQty:null};
    const hoQty = plan.hoQty!=null ? plan.hoQty : r.suggested;      // HO sees system suggestion until they override
    const rsmQty = plan.rsmQty!=null ? plan.rsmQty : hoQty;         // RSM sees HO's number until they override
    const s1 = Math.round(rsmQty*0.5), s2 = Math.round(rsmQty*0.25), s3 = Math.max(rsmQty-s1-s2,0);
    const avgPrice = blendedPricesCur[r.family] || blendedPricesPrior[r.family] || 0;
    const hasExactValue = r.family in skuValueDetail.byFamily;
    const hoValue = hasExactValue ? skuValueDetail.byFamily[r.family] : hoQty*avgPrice;
    const rsmValue = rsmQty*avgPrice; // RSM's own adjustment is always family-level, so always estimated
    return {...r, hoQtySaved:plan.hoQty, rsmQtySaved:plan.rsmQty, hoQty, rsmQty, s1, s2, s3, avgPrice, hoValue, rsmValue, hasExactValue};
  });
  return {rows, stockUploaded:suggestedData.stockUploaded, priorMonth:suggestedData.priorMonth, status, anyPricing: Object.values(rows).some(r=>r.avgPrice>0)};
}

/* ============================= SKU -> ACHIEVEMENT-FAMILY RESOLVER ============================= */
// Target-setting family names don't reliably match the DCM hierarchy (see project
// notes), but every SKU code IS reliably tagged with its achievement-family in
// monthly_achievement_sku. We use that as the join key for rolling SKU-wise
// uploads (stock, HO qty) up to family level, regardless of which month/town
// the mapping was first observed in — a SKU's family classification is stable.
let skuFamilyMapCache = null;
async function buildSkuFamilyMap(){
  if(skuFamilyMapCache) return skuFamilyMapCache;
  if(!sb) return {};
  const {data, error} = await sb.from('monthly_achievement_sku').select('sku_code,family');
  if(error){ console.error(error); return {}; }
  const counts = {}; // sku_code -> {family -> occurrences}
  (data||[]).forEach(r=>{
    if(!counts[r.sku_code]) counts[r.sku_code] = {};
    counts[r.sku_code][r.family] = (counts[r.sku_code][r.family]||0)+1;
  });
  const map = {};
  Object.keys(counts).forEach(code=>{
    const fams = counts[code];
    map[code] = Object.keys(fams).sort((a,b)=>fams[b]-fams[a])[0]; // most-frequently-seen family wins
  });
  skuFamilyMapCache = map;
  return map;
}

// Expected format per line: Town, SKU Code, Qty
async function uploadStockSkuWiseBulk(month, text){
  const familyMap = await buildSkuFamilyMap();
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const skuRows = [], unmatched = [];
  const familyTotals = {}; // town -> family -> qty

  lines.forEach(line=>{
    const parts = line.split(/[,\t]/).map(p=>p.trim());
    if(parts.length<3){ unmatched.push(line); return; }
    const [town, skuCode, rawQty] = parts;
    const qty = Number(String(rawQty).replace(/,/g,''));
    if(!ALL_TOWNS.includes(town) || isNaN(qty)){ unmatched.push(line); return; }
    const family = familyMap[skuCode];
    if(!family){ unmatched.push(line+'  (SKU not recognized from any achievement report yet)'); return; }
    skuRows.push({month, town, sku_code:skuCode, qty});
    familyTotals[town] = familyTotals[town] || {};
    familyTotals[town][family] = (familyTotals[town][family]||0) + qty;
  });

  if(skuRows.length){
    const {error} = await sb.from('opening_stock_sku').upsert(skuRows, {onConflict:'month,town,sku_code'});
    if(error) return {ok:false, error:error.message};
  }
  const familyRows = [];
  Object.keys(familyTotals).forEach(town=>{
    Object.keys(familyTotals[town]).forEach(family=>{
      familyRows.push({month, town, family, qty: familyTotals[town][family]});
    });
  });
  if(familyRows.length){
    const {error} = await sb.from('opening_stock_family').upsert(familyRows, {onConflict:'month,town,family'});
    if(error) return {ok:false, error:error.message};
  }
  const townCount = Object.keys(familyTotals).length;
  await logAudit('stock_sku_upload', month, null, `${skuRows.length} SKUs across ${townCount} towns → ${familyRows.length} family totals updated`);
  return {ok:true, skuCount:skuRows.length, familyCount:familyRows.length, townCount, unmatched};
}

/* Parses an "Achievement vs Target" workbook exactly like the source file:
   each sheet = one town, SKU rows followed by a family subtotal row. */
async function uploadAchievementWorkbook(file, month, type){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const skip = new Set(['Smmary (2)','Target','Order_Qty','Order_Value','LP','FSD_TRY','LHR_TRY','Upper_Punjab_Region','North_Region']);
  const familyRows = [], skuRows = [];
  let sheetsProcessed = 0, townsUnmatched = [];

  wb.SheetNames.forEach(sheetName=>{
    if(skip.has(sheetName)) return;
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    if(rows.length < 6) return;
    let townName = (rows[2] && rows[2][3]) || (rows[1] && rows[1][10]);
    if(!townName) return;
    townName = String(townName).trim().replace(/,$/,'');
    if(!ALL_TOWNS.includes(townName)){ townsUnmatched.push(sheetName+' -> '+townName); return; }

    let buffer = [];
    for(let i=5; i<rows.length; i++){
      const row = rows[i] || [];
      const skuCode = row[2], product = row[3], target = row[4], netOrders = row[5];
      if(product==null) continue;
      const pname = String(product).trim();
      if(skuCode){
        buffer.push({sku_code:String(skuCode).trim(), qty:Number(netOrders)||0});
      } else {
        if(pname.toLowerCase().startsWith('total value')) continue;
        buffer.forEach(b=>{ skuRows.push({month, town:townName, sku_code:b.sku_code, family:pname, qty:b.qty, type}); });
        familyRows.push({month, town:townName, family:pname, target_qty:Number(target)||0, achieved_qty:Number(netOrders)||0, variance:(Number(netOrders)||0)-(Number(target)||0), type});
        buffer = [];
      }
    }
    buffer.forEach(b=>{
      skuRows.push({month, town:townName, sku_code:b.sku_code, family:'(Ungrouped)', qty:b.qty, type});
    });
    sheetsProcessed++;
  });

  // upsert in batches (Supabase handles large arrays fine, but chunk defensively)
  async function upsertChunked(table, rows, conflict){
    const chunkSize = 1000;
    for(let i=0; i<rows.length; i+=chunkSize){
      const chunk = rows.slice(i, i+chunkSize);
      const {error} = await sb.from(table).upsert(chunk, {onConflict:conflict});
      if(error) return error.message;
    }
    return null;
  }
  const famErr = await upsertChunked('monthly_achievement_family', familyRows, 'month,town,family,type');
  if(famErr) return {ok:false, error:famErr};
  const skuErr = await upsertChunked('monthly_achievement_sku', skuRows, 'month,town,sku_code,type');
  if(skuErr) return {ok:false, error:skuErr};

  return {ok:true, sheetsProcessed, familyRows:familyRows.length, skuRows:skuRows.length, townsUnmatched};
}

    const rows = await fetchFamilyAchievement(month, t, 'primary');
    let target=0, achieved=0;
    rows.forEach(r=>{ target+=Number(r.target_qty)||0; achieved+=Number(r.achieved_qty)||0; });
    out[t] = {target, achieved, familyCount: rows.length};
  }));
  return out;
}

function renderTownAchievementDetail(town, familyData){
  const isVal = state.viewMode==='value';
  const anyPricing = Object.values(familyData).some(d=>d.hasPricing);
  const families = Object.keys(familyData).sort((a,b)=>{
    const va = isVal ? (familyData[a].targetValueEst - familyData[a].achievedValue) : (familyData[a].target - familyData[a].achieved);
    const vb = isVal ? (familyData[b].targetValueEst - familyData[b].achievedValue) : (familyData[b].target - familyData[b].achieved);
    return vb - va;
  });
  const fmt = isVal ? fmtRs : fmtQty;
  let totTarget=0, totAch=0;
  families.forEach(f=>{
    totTarget += isVal ? familyData[f].targetValueEst : familyData[f].target;
    totAch += isVal ? familyData[f].achievedValue : familyData[f].achieved;
  });
  const pct = achPct(totTarget, totAch);
  return `
  <div class="entry-screen-header">
    <button class="back-btn" onclick="backToTownGrid()">←</button>
    <h2>${esc(town)} — ${monthLabel(state.month)}</h2>
    <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="downloadTownCsv('${escJs(town)}')">⬇ Download CSV</button>
  </div>
  ${viewToggleHtml()}
  ${isVal && !anyPricing ? `<div class="err" style="background:var(--amber-bg);color:var(--amber);">No SKU prices configured yet in Product Hierarchy — value figures will show as Rs 0 until prices are uploaded.</div>` : ''}
  ${isVal && anyPricing ? `<div class="footer-note" style="text-align:left;margin:0 0 16px;">Target value is <b>estimated</b> — it's this month's actual blended selling price applied to the unit target, since targets are only set in units, not value.</div>` : ''}
  <div class="cards-row">
    <div class="stat-card"><div class="stat-label">Total Target</div><div class="stat-value">${fmt(totTarget)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Achieved</div><div class="stat-value">${fmt(totAch)}</div></div>
    <div class="stat-card"><div class="stat-label">Remaining Balance</div><div class="stat-value ${totTarget-totAch>0?'neg':'pos'}">${fmt(Math.max(totTarget-totAch,0))}</div></div>
    <div class="stat-card"><div class="stat-label">Achievement</div><div class="stat-value">${fmtPct(pct)}</div></div>
  </div>
  <div class="panel">
    <h3>Family-wise (Primary) <span class="cnt">${families.length} families · tap to see SKUs</span></h3>
    <table class="responsive-table">
      <thead><tr><th>Family</th><th class="num">Target${isVal?' (est.)':''}</th><th class="num">Achieved</th><th class="num">Variance</th><th class="num">Balance</th><th>Achv.</th></tr></thead>
      <tbody>
      ${families.map(f=>{
        const d = familyData[f];
        const target = isVal ? d.targetValueEst : d.target;
        const achieved = isVal ? d.achievedValue : d.achieved;
        const variance = achieved - target;
        const fpct = achPct(target, achieved);
        const balance = Math.max(target - achieved, 0);
        const expanded = state.expandedFamily===f;
        const skuRows = expanded ? d.skus.slice().sort((a,b)=> (isVal?b.value-a.value:b.qty-a.qty)).map(s=>`
          <tr class="sku-subrow">
            <td data-label="SKU">${esc(s.sku_name)} <span class="mono" style="color:var(--muted);font-size:11px;">(${esc(s.sku_code)}${s.uom?', '+esc(s.uom):''})</span></td>
            <td class="num" data-label="Target">—</td>
            <td class="num" data-label="Achieved">${isVal ? fmtRs(s.value) : fmtQty(s.qty)}</td>
            <td class="num" data-label="Variance">—</td>
            <td class="num" data-label="Balance">—</td>
            <td data-label="Achv.">—</td>
          </tr>`).join('') : '';
        return `<tr class="family-row" onclick="toggleFamily('${escJs(f)}')">
          <td data-label="Family"><span class="expand-caret">${expanded?'▾':'▸'}</span>${esc(f)}</td>
          <td class="num" data-label="Target">${fmt(target)}</td>
          <td class="num" data-label="Achieved">${fmt(achieved)}</td>
          <td class="num ${variance>=0?'pos':'neg'}" data-label="Variance">${fmt(variance)}</td>
          <td class="num ${balance>0?'neg':''}" data-label="Balance">${fmt(balance)}</td>
          <td data-label="Achv."><div class="meter"><div class="meter-fill" style="width:${Math.min(fpct,100)}%;background:${meterColor(fpct)}"></div></div></td>
        </tr>${skuRows}`;
      }).join('')}
      </tbody>
    </table>
  </div>
  <p class="footer-note">"Balance" is the remaining gap to hit this month's target (0 if already met) — carry this into next month's follow-up. SKU rows show actual achievement only; targets are set at family level, not SKU level.</p>`;
}

function downloadTownCsv(town){
  const d = state.familyData;
  if(!d) return;
  let csv = 'Family,SKU Code,SKU Name,UOM,Price,Target Qty (Family),Achieved Qty (Family),Variance Qty (Family),Target Value Est (Family),Achieved Value (Family),SKU Qty,SKU Value\n';
  Object.keys(d).forEach(f=>{
    const fam = d[f];
    if(fam.skus.length===0){
      csv += `"${f}",,,,,"${fam.target}","${fam.achieved}","${fam.variance}","${fam.targetValueEst.toFixed(2)}","${fam.achievedValue.toFixed(2)}",,\n`;
    } else {
      fam.skus.forEach(s=>{
        csv += `"${f}","${s.sku_code}","${s.sku_name}","${s.uom}","${s.price}","${fam.target}","${fam.achieved}","${fam.variance}","${fam.targetValueEst.toFixed(2)}","${fam.achievedValue.toFixed(2)}","${s.qty}","${s.value.toFixed(2)}"\n`;
      });
    }
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${town.replace(/\s+/g,'_')}_${state.month}_achievement.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function handleHoQtyChange(town, family, val){
  const qty = Number(val);
  if(isNaN(qty) || qty<0){ alert('Enter a valid quantity.'); render(); return; }
  const before = state.orderPlanData.rows.find(r=>r.family===family);
  const beforeVal = before ? before.hoQty : null;
  const ok = await dbSaveHoQty(state.month, town, family, qty);
  if(ok){
    await logAudit('ho_qty_change', state.month, town, `${family}: ${fmtQty(beforeVal)} → ${fmtQty(qty)}`);
    state.orderPlanData = await buildOrderPlanView(state.month, town); render();
  }
}
async function handleRsmQtyChange(town, family, val){
  const qty = Number(val);
  if(isNaN(qty) || qty<0){ alert('Enter a valid quantity.'); render(); return; }
  const before = state.orderPlanData.rows.find(r=>r.family===family);
  const beforeVal = before ? before.rsmQty : null;
  const ok = await dbSaveRsmQty(state.month, town, family, qty);
  if(ok){
    await logAudit('rsm_qty_change', state.month, town, `${family}: ${fmtQty(beforeVal)} → ${fmtQty(qty)}`);
    state.orderPlanData = await buildOrderPlanView(state.month, town); render();
  }
}
async function handleSubmitToRsm(town){
  if(!confirm(`Submit the ${monthLabel(state.month)} order plan for ${town} to its RSM? They'll be able to see and adjust it immediately.`)) return;
  const ok = await dbSubmitToRsm(state.month, town);
  if(ok){
    await logAudit('submit_to_rsm', state.month, town, `Order plan released to RSM`);
    state.orderPlanData = await buildOrderPlanView(state.month, town); render();
  }
}
function downloadOrderPlanCsv(town){
  const {rows} = state.orderPlanData;

async function loadNsmView(){
  const body = document.getElementById('nsmBody');
  if(state.nsmView==='achievement'){
    if(state.selectedTown){
      if(!state.familyData) state.familyData = await fetchTownData(state.month, state.selectedTown, 'primary');
      body.innerHTML = renderTownAchievementDetail(state.selectedTown, state.familyData);
    } else if(state.expandedRsm){
      const towns = TOWN_DATA[state.expandedRsm].towns;
      if(!state.nsmFamilySummary) state.nsmFamilySummary = await buildTownSummaries(towns, state.month);
      body.innerHTML = renderRsmTownGridWrapper(state.expandedRsm, towns, 'achievement');
    } else {
      body.innerHTML = await renderRsmSummaryAsync('achievement');
    }
  } else if(state.nsmView==='suggested'){
    if(state.selectedTown){
      if(!state.orderPlanData) state.orderPlanData = await buildOrderPlanView(state.month, state.selectedTown);
      body.innerHTML = renderOrderPlanDetail(state.selectedTown, state.orderPlanData, state.user.role==='admin' ? 'admin' : 'nsm');
    } else if(state.expandedRsm){
      body.innerHTML = renderRsmTownGridWrapper(state.expandedRsm, TOWN_DATA[state.expandedRsm].towns, 'suggested');
    } else {
      body.innerHTML = await renderRsmSummaryAsync('suggested');
    }
  } else if(state.nsmView==='hierarchy'){
    if(!state.hierarchyData) await fetchHierarchy();
    body.innerHTML = renderHierarchyBrowser();
  } else if(state.nsmView==='stock'){
    body.innerHTML = renderStockPlaceholder();
  } else if(state.nsmView==='upload'){
    if(state.adminUploadTab==='log' && !state.auditLogData) await loadChangeLog();
    body.innerHTML = renderAdminUpload();
  }
}

async function renderRsmSummaryAsync(mode){
  const rows = await Promise.all(RSM_IDS.map(async id=>{
    const towns = TOWN_DATA[id].towns;
    const summaries = await buildTownSummaries(towns, state.month);
    let target=0, achieved=0;
    towns.forEach(t=>{ target+=summaries[t].target; achieved+=summaries[t].achieved; });
    return {id, name:TOWN_DATA[id].name, target, achieved, townCount:towns.length};
  }));
  let totTarget=0, totAch=0;
  rows.forEach(r=>{ totTarget+=r.target; totAch+=r.achieved; });
  const pct = achPct(totTarget, totAch);
  return `

    <div class="stat-card"><div class="stat-label">Achievement</div><div class="stat-value">${fmtPct(pct)}</div></div>
  </div>
  <div class="panel">
    <h3>${mode==='suggested'?'Order Plan':'Achievement vs Target'} — RSM-wise <span class="cnt">tap a row to drill into towns</span></h3>
    <table class="responsive-table">
      <thead><tr><th>RSM</th><th class="num">Target</th><th class="num">Achieved</th><th class="num">Balance</th><th>Achv.</th><th class="num">Towns</th></tr></thead>
      <tbody>
      ${rows.map(r=>{
        const rpct = achPct(r.target, r.achieved);
        return `<tr class="clickable" onclick="drillRsm('${r.id}')">
          <td data-label="RSM"><b>${esc(r.name)}</b></td>
          <td class="num" data-label="Target">${fmtQty(r.target)}</td>
          <td class="num" data-label="Achieved">${fmtQty(r.achieved)}</td>

          <td class="num" data-label="Towns">${r.townCount}</td>

}

async function handlePricingUpload(){
  const text = document.getElementById('pricingPasteInput').value;
  if(!text.trim()){ alert('Paste at least one line.'); return; }
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [], unmatched = [];
  lines.forEach(line=>{
    const parts = line.split(/[,\t]/).map(p=>p.trim());
    if(parts.length<2){ unmatched.push(line); return; }
    const sku_code = parts[0];
    const price = Number(String(parts[1]).replace(/,/g,''));
    const uom = parts[2] || 'PCS';
    if(!sku_code || isNaN(price)){ unmatched.push(line); return; }
    rows.push({sku_code, price, uom});
  });
  let res;
  if(rows.length){
    // Check which SKU codes don't exist yet — inserting price/uom alone would
    // violate product_hierarchy's NOT NULL sku_name/dcm_family and fail the
    // ENTIRE batch over just the new codes. So pre-create any unknown codes
    // with a placeholder name first, then the price/uom upsert always succeeds.
    // Chunked defensively so a large paste (hundreds of codes) never risks a
    // URL-length or payload-size edge case in a single request.
    function chunk(arr, size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }
    const codes = rows.map(r=>r.sku_code);
    const existingSet = new Set();
    for(const codeChunk of chunk(codes, 100)){
      const {data, error} = await sb.from('product_hierarchy').select('sku_code').in('sku_code', codeChunk);
      if(error){ state.adminUploadResult = {kind:'pricing', ok:false, error:error.message}; render(); return; }
      (data||[]).forEach(r=>existingSet.add(r.sku_code));
    }
    const newCodes = codes.filter(c=>!existingSet.has(c));
    if(newCodes.length){
      const placeholders = newCodes.map(c=>({sku_code:c, sku_name:`(Unnamed SKU ${c})`, dcm_family:'(Unclassified)'}));
      for(const phChunk of chunk(placeholders, 200)){
        const {error: phError} = await sb.from('product_hierarchy').upsert(phChunk, {onConflict:'sku_code', ignoreDuplicates:true});
        if(phError){ state.adminUploadResult = {kind:'pricing', ok:false, error:phError.message}; render(); return; }
      }
    }
    let upsertError = null;
    for(const rowChunk of chunk(rows, 200)){
      const {error} = await sb.from('product_hierarchy').upsert(rowChunk, {onConflict:'sku_code', ignoreDuplicates:false});
      if(error){ upsertError = error; break; }
    }
    const error = upsertError;
    res = error ? {ok:false, error:error.message} : {ok:true, count:rows.length, unmatched, newCodes};
    if(!error){
      let details = `${rows.length} SKU prices updated`;
      if(newCodes.length) details += ` (${newCodes.length} new SKU code(s) auto-created with placeholder names — rename them in Product Hierarchy: ${newCodes.join(', ')})`;
      await logAudit('pricing_upload', null, null, details);
    }
  } else {
    res = {ok:true, count:0, unmatched};
  }
  state.adminUploadResult = {kind:'pricing', ...res};
  render();
}

function renderUploadResultBox(r){
  if(!r.ok) return `<div class="err" style="margin-top:12px;">Upload failed: ${esc(r.error)}</div>`;
  let html = `<div style="margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--green-bg);font-size:12.5px;">`;
  if(r.kind==='achievement'){
    html += `<b>${r.sheetsProcessed} town sheets processed</b> — ${r.familyRows} family rows, ${r.skuRows} SKU rows upserted.`;
    if(r.townsUnmatched && r.townsUnmatched.length){
      html += `<div style="margin-top:6px;color:var(--amber);">${r.townsUnmatched.length} sheet(s) skipped — town name not recognized:<br>${r.townsUnmatched.map(esc).join('<br>')}</div>`;
    }
  } else if(r.kind==='stock' || r.kind==='ho_sku'){
    html += `<b>${r.skuCount} SKU rows across ${r.townCount} towns</b> → ${r.familyCount} family totals updated.`;
    if(r.unmatched && r.unmatched.length){
      html += `<div style="margin-top:6px;color:var(--amber);">${r.unmatched.length} line(s) skipped:<br>${r.unmatched.map(esc).join('<br>')}</div>`;
    }
  } else {
    html += `<b>${r.count} row(s) updated.</b>`;
    if(r.unmatched && r.unmatched.length){
      html += `<div style="margin-top:6px;color:var(--amber);">${r.unmatched.length} line(s) couldn't be parsed:<br>${r.unmatched.map(esc).join('<br>')}</div>`;
    }
    if(r.newCodes && r.newCodes.length){
      html += `<div style="margin-top:6px;color:var(--amber);">${r.newCodes.length} SKU code(s) weren't in Product Hierarchy yet — auto-created with placeholder names so this upload wouldn't fail. Please rename them properly:<br>${r.newCodes.map(esc).join('<br>')}</div>`;
    }
  }
  html += `</div>`;
  return html;
}
