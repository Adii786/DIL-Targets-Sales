/* ============================= HELPERS ============================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escJs(s){ return esc(s).replace(/'/g,"\\'"); }

/* ============================= DATA LAYER ============================= */
async function fetchFamilyAchievement(month, town, type){
  if(!sb) return [];
  type = type || 'primary';
  const {data, error} = await sb.from('monthly_achievement_family').select('*')
    .eq('month', month).eq('town', town).eq('type', type).order('family');
  if(error){ console.error(error); return []; }
  return data||[];
}
async function fetchSkuAchievement(month, town, type){
  if(!sb) return [];
  type = type || 'primary';
  const {data, error} = await sb.from('monthly_achievement_sku').select('*')
    .eq('month', month).eq('town', town).eq('type', type);
  if(error){ console.error(error); return []; }
  return data||[];
}
async function fetchSkuNames(codes){
  if(!sb || !codes.length) return {};
  const {data, error} = await sb.from('product_hierarchy').select('sku_code,sku_name').in('sku_code', codes);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.sku_code]=r.sku_name);
  return map;
}
async function fetchTownData(month, town, type){
  const [famRows, skuRows] = await Promise.all([
    fetchFamilyAchievement(month, town, type),
    fetchSkuAchievement(month, town, type)
  ]);
  const skuCodes = [...new Set(skuRows.map(r=>r.sku_code))];
  const nameMap = await fetchSkuNames(skuCodes);
  const byFamily = {};
  famRows.forEach(f=>{ byFamily[f.family] = { target:Number(f.target_qty)||0, achieved:Number(f.achieved_qty)||0, variance:Number(f.variance_qty!==undefined?f.variance_qty:f.variance)||0, skus:[] }; });
  skuRows.forEach(r=>{
    if(!byFamily[r.family]) byFamily[r.family] = {target:0, achieved:0, variance:0, skus:[]};
    byFamily[r.family].skus.push({ sku_code:r.sku_code, sku_name: nameMap[r.sku_code] || r.sku_code, qty: Number(r.qty)||0 });
  });
  return byFamily;
}
async function fetchTargetFamily(month, town){
  if(!sb) return {};
  const {data, error} = await sb.from('monthly_target_family').select('*').eq('month',month).eq('town',town);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.family]=Number(r.target_qty)||0);
  return map;
}
async function fetchOpeningStockFamily(month, town){
  if(!sb) return {};
  const {data, error} = await sb.from('opening_stock_family').select('*').eq('month',month).eq('town',town);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(r=> map[r.family]=Number(r.qty)||0);
  return map;
}
function prevMonth(m){
  const [y,mo] = m.split('-').map(Number);
  const d = new Date(y, mo-2, 1); // mo-1 is current month index, -1 more for previous
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const SHORTFALL_CAP_RATIO = 1.0; // carried-forward shortfall capped at 100% of the new month's own target — ask Adnan before raising this

/* Suggested order = (this month's target + capped carry-forward shortfall from last month) − opening stock, floored at 0.
   Then split 50% / 25% / 25% across 3 supplies. */
async function computeSuggestedOrder(month, town){
  const prior = prevMonth(month);
  const [curTargets, priorAch, stock] = await Promise.all([
    fetchTargetFamily(month, town),
    fetchFamilyAchievement(prior, town, 'primary'),
    fetchOpeningStockFamily(month, town)
  ]);
  const priorMap = {};
  priorAch.forEach(r=> priorMap[r.family] = { target:Number(r.target_qty)||0, achieved:Number(r.achieved_qty)||0 });

  const families = new Set([...Object.keys(curTargets), ...Object.keys(priorMap)]);
  const rows = [];
  families.forEach(fam=>{
    const augTarget = curTargets[fam] || 0;
    const p = priorMap[fam];
    const rawShortfall = p ? Math.max(p.target - p.achieved, 0) : 0;
    const cappedShortfall = Math.min(rawShortfall, augTarget * SHORTFALL_CAP_RATIO);
    const openingStock = stock[fam] || 0;
    const suggested = Math.max(augTarget + cappedShortfall - openingStock, 0);
    const s1 = Math.round(suggested*0.5);
    const s2 = Math.round(suggested*0.25);
    const s3 = Math.max(suggested - s1 - s2, 0);
    rows.push({family:fam, augTarget, rawShortfall, cappedShortfall, openingStock, suggested, s1, s2, s3, hasStockData: fam in stock});
  });
  rows.sort((a,b)=> b.suggested - a.suggested);
  const stockUploaded = Object.keys(stock).length > 0;
  return {rows, stockUploaded, priorMonth:prior};
}

async function uploadStockBulk(month, town, text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [], unmatched = [];
  lines.forEach(line=>{
    const parts = line.split(/[,\t]/).map(p=>p.trim());
    if(parts.length<2){ unmatched.push(line); return; }
    const family = parts[0];
    const qty = Number(String(parts[1]).replace(/,/g,''));
    if(!family || isNaN(qty)){ unmatched.push(line); return; }
    rows.push({month, town, family, qty});
  });
  if(rows.length){
    const {error} = await sb.from('opening_stock_family').upsert(rows, {onConflict:'month,town,family'});
    if(error) return {ok:false, error:error.message};
  }
  return {ok:true, count:rows.length, unmatched};
}
async function fetchHierarchy(){
  if(!sb) return [];
  if(state.hierarchyData) return state.hierarchyData;
  const {data, error} = await sb.from('product_hierarchy').select('*').order('dcm_family').order('sku_code');
  if(error){ console.error(error); return []; }
  state.hierarchyData = data||[];
  return state.hierarchyData;
}

/* ---- uploads ---- */
async function uploadTargetBulk(month, town, text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [], unmatched = [];
  lines.forEach(line=>{
    const parts = line.split(/[,\t]/).map(p=>p.trim());
    if(parts.length<2){ unmatched.push(line); return; }
    const family = parts[0];
    const qty = Number(String(parts[1]).replace(/,/g,''));
    if(!family || isNaN(qty)){ unmatched.push(line); return; }
    rows.push({month, town, family, target_qty:qty});
  });
  if(rows.length){
    const {error} = await sb.from('monthly_target_family').upsert(rows, {onConflict:'month,town,family'});
    if(error) return {ok:false, error:error.message};
  }
  return {ok:true, count:rows.length, unmatched};
}

/* Parses an "Achievement vs Target" workbook exactly like the source file:
   each sheet = one town, SKU rows followed by a family subtotal row. */
async function uploadAchievementWorkbook(file, month, type){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const skip = new Set(['Smmary (2)','Target','Order_Qty','Order_Value','LP','FSD_TRY','LHR_TRY','Upper_Punjab_Region','North_Region']);
  const familyRows = [], skuRows = [];
  let sheetsProcessed = 0, townsUnmatched = [];

  wb.SheetNames.forEach(sheetName=>{
    if(skip.has(sheetName)) return;
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    if(rows.length < 6) return;
    let townName = (rows[2] && rows[2][3]) || (rows[1] && rows[1][10]);
    if(!townName) return;
    townName = String(townName).trim().replace(/,$/,'');
    if(!ALL_TOWNS.includes(townName)){ townsUnmatched.push(sheetName+' -> '+townName); return; }

    let buffer = [];
    for(let i=5; i<rows.length; i++){
      const row = rows[i] || [];
      const skuCode = row[2], product = row[3], target = row[4], netOrders = row[5];
      if(product==null) continue;
      const pname = String(product).trim();
      if(skuCode){
        buffer.push({sku_code:String(skuCode).trim(), qty:Number(netOrders)||0});
      } else {
        if(pname.toLowerCase().startsWith('total value')) continue;
        buffer.forEach(b=>{ skuRows.push({month, town:townName, sku_code:b.sku_code, family:pname, qty:b.qty, type}); });
        familyRows.push({month, town:townName, family:pname, target_qty:Number(target)||0, achieved_qty:Number(netOrders)||0, variance:(Number(netOrders)||0)-(Number(target)||0), type});
        buffer = [];
      }
    }
    buffer.forEach(b=>{
      skuRows.push({month, town:townName, sku_code:b.sku_code, family:'(Ungrouped)', qty:b.qty, type});
    });
    sheetsProcessed++;
  });

  // upsert in batches (Supabase handles large arrays fine, but chunk defensively)
  async function upsertChunked(table, rows, conflict){
    const chunkSize = 1000;
    for(let i=0; i<rows.length; i+=chunkSize){
      const chunk = rows.slice(i, i+chunkSize);
      const {error} = await sb.from(table).upsert(chunk, {onConflict:conflict});
      if(error) return error.message;
    }
    return null;
  }
  const famErr = await upsertChunked('monthly_achievement_family', familyRows, 'month,town,family,type');
  if(famErr) return {ok:false, error:famErr};
  const skuErr = await upsertChunked('monthly_achievement_sku', skuRows, 'month,town,sku_code,type');
  if(skuErr) return {ok:false, error:skuErr};

  return {ok:true, sheetsProcessed, familyRows:familyRows.length, skuRows:skuRows.length, townsUnmatched};
}

async function buildTownSummaries(towns, month){
  const out = {};
  await Promise.all(towns.map(async t=>{
    const rows = await fetchFamilyAchievement(month, t, 'primary');
    let target=0, achieved=0;
    rows.forEach(r=>{ target+=Number(r.target_qty)||0; achieved+=Number(r.achieved_qty)||0; });
    out[t] = {target, achieved, familyCount: rows.length};
  }));
  return out;
}

function downloadTownCsv(town){
  const d = state.familyData;
  if(!d) return;
  let csv = 'Family,SKU Code,SKU Name,Target (Family),Achieved (Family),Variance (Family),SKU Qty\n';
  Object.keys(d).forEach(f=>{
    const fam = d[f];
    if(fam.skus.length===0){
      csv += `"${f}",,,"${fam.target}","${fam.achieved}","${fam.variance}",\n`;
    } else {
      fam.skus.forEach(s=>{
        csv += `"${f}","${s.sku_code}","${s.sku_name}","${fam.target}","${fam.achieved}","${fam.variance}","${s.qty}"\n`;
      });
    }
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${town.replace(/\s+/g,'_')}_${state.month}_achievement.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

    <div class="empty-note" style="padding:40px 0;">
      Awaiting opening stock data from the FGS/material team.<br>
      Once uploaded (family-wise, town-wise), this screen will show stock availability and flag slow-moving families for alternate-product pushes — and the Suggested Order screen will automatically start netting it off.
    </div>
  </div>`;
}

/* ============================= NSM / ADMIN SHELL ============================= */
function renderNsmShell(){
  const isAdmin = state.user.role==='admin';
  const tabs = [
    {k:'achievement', l:'Achievement', ic:'●'},
    {k:'suggested', l:'Suggested Order', ic:'▶'},
    {k:'hierarchy', l:'Hierarchy', ic:'▤'},
    {k:'stock', l:'Stock', ic:'▦'}
  ];
  if(isAdmin) tabs.push({k:'upload', l:'Upload', ic:'⬆'});
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><img src="dil_logo.png" alt="DOLLAR"></div>
      <div class="brand-text"><div class="t1">${isAdmin?'Sales Ops — Admin View':'Head Office — NSM View'}</div><div class="t2">All regions · ${RSM_IDS.length} RSMs · ${ALL_TOWNS.length} towns</div></div>
    </div>
    <div class="top-right">
      <div class="today-pill">${monthLabel(state.month)}</div>
      <button class="logout" onclick="doLogout()">Log out</button>
    </div>
  </div>
  <div class="container">
    <div class="row-flex" style="margin-bottom:16px;">
      <div class="field" style="max-width:220px;">
        <label>Month</label>
        <select onchange="changeMonth(this.value)">
          ${MONTH_OPTIONS.map(m=>`<option value="${m}" ${state.month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="tabs desktop-tabs">
      ${tabs.map(t=>`<button class="tab ${state.nsmView===t.k?'active':''}" onclick="setNsmView('${t.k}')">${t.l}</button>`).join('')}
    </div>
    <div id="nsmBody"><div class="loading">Loading…</div></div>
  </div>
  <div class="bottom-nav"><div class="bottom-nav-row">
    ${tabs.map(t=>`<button class="bottom-nav-item ${state.nsmView===t.k?'active':''}" onclick="setNsmView('${t.k}')"><span class="ic">${t.ic}</span>${t.l}</button>`).join('')}
  </div></div>`;
}
function setNsmView(v){ state.nsmView=v; state.expandedRsm=null; state.selectedTown=null; state.expandedFamily=null; render(); }

async function loadNsmView(){
  const body = document.getElementById('nsmBody');
  if(state.nsmView==='achievement'){
    if(state.selectedTown){
      if(!state.familyData) state.familyData = await fetchTownData(state.month, state.selectedTown, 'primary');
      body.innerHTML = renderTownAchievementDetail(state.selectedTown, state.familyData);
    } else if(state.expandedRsm){
      const towns = TOWN_DATA[state.expandedRsm].towns;
      if(!state.nsmFamilySummary) state.nsmFamilySummary = await buildTownSummaries(towns, state.month);
      body.innerHTML = renderRsmTownGridWrapper(state.expandedRsm, towns, 'achievement');
    } else {
      body.innerHTML = await renderRsmSummaryAsync('achievement');
    }
  } else if(state.nsmView==='suggested'){
    if(state.selectedTown){
      if(!state.suggestedData) state.suggestedData = await computeSuggestedOrder(state.month, state.selectedTown);
      body.innerHTML = renderSuggestedOrderDetail(state.selectedTown, state.suggestedData);
    } else if(state.expandedRsm){
      body.innerHTML = renderRsmTownGridWrapper(state.expandedRsm, TOWN_DATA[state.expandedRsm].towns, 'suggested');
    } else {
      body.innerHTML = await renderRsmSummaryAsync('suggested');
    }
  } else if(state.nsmView==='hierarchy'){
    if(!state.hierarchyData) await fetchHierarchy();
    body.innerHTML = renderHierarchyBrowser();
  } else if(state.nsmView==='stock'){
    body.innerHTML = renderStockPlaceholder();
  } else if(state.nsmView==='upload'){
    body.innerHTML = renderAdminUpload();
  }
}
function drillRsm(id){ state.expandedRsm=id; state.nsmFamilySummary=null; render(); }
function backToRsmSummary(){ state.expandedRsm=null; state.selectedTown=null; render(); }
function renderRsmTownGridWrapper(rsmId, towns, mode){
  return `
  <div class="entry-screen-header"><button class="back-btn" onclick="backToRsmSummary()">←</button><h2>${esc(TOWN_DATA[rsmId].name)}</h2></div>
  ${renderTownGrid(towns, state.nsmFamilySummary, mode)}`;
}

async function renderRsmSummaryAsync(mode){
  const rows = await Promise.all(RSM_IDS.map(async id=>{
    const towns = TOWN_DATA[id].towns;
    const summaries = await buildTownSummaries(towns, state.month);
    let target=0, achieved=0;
    towns.forEach(t=>{ target+=summaries[t].target; achieved+=summaries[t].achieved; });
    return {id, name:TOWN_DATA[id].name, target, achieved, townCount:towns.length};
  }));
  let totTarget=0, totAch=0;
  rows.forEach(r=>{ totTarget+=r.target; totAch+=r.achieved; });
  const pct = achPct(totTarget, totAch);
  return `
  <div class="cards-row">
    <div class="stat-card"><div class="stat-label">Total Target — All Regions</div><div class="stat-value">${fmtQty(totTarget)}</div></div>
    <div class="stat-card"><div class="stat-label">Total Achieved</div><div class="stat-value">${fmtQty(totAch)}</div></div>
    <div class="stat-card"><div class="stat-label">Remaining Balance</div><div class="stat-value ${totTarget-totAch>0?'neg':'pos'}">${fmtQty(Math.max(totTarget-totAch,0))}</div></div>
    <div class="stat-card"><div class="stat-label">Achievement</div><div class="stat-value">${fmtPct(pct)}</div></div>
  </div>
  <div class="panel">
    <h3>${mode==='suggested'?'Suggested Orders':'Achievement vs Target'} — RSM-wise <span class="cnt">tap a row to drill into towns</span></h3>
    <table class="responsive-table">
      <thead><tr><th>RSM</th><th class="num">Target</th><th class="num">Achieved</th><th class="num">Balance</th><th>Achv.</th><th class="num">Towns</th></tr></thead>
      <tbody>
      ${rows.map(r=>{
        const rpct = achPct(r.target, r.achieved);
        return `<tr class="clickable" onclick="drillRsm('${r.id}')">
          <td data-label="RSM"><b>${esc(r.name)}</b></td>
          <td class="num" data-label="Target">${fmtQty(r.target)}</td>
          <td class="num" data-label="Achieved">${fmtQty(r.achieved)}</td>
          <td class="num ${r.target-r.achieved>0?'neg':''}" data-label="Balance">${fmtQty(Math.max(r.target-r.achieved,0))}</td>
          <td data-label="Achv."><div class="meter"><div class="meter-fill" style="width:${Math.min(rpct,100)}%;background:${meterColor(rpct)}"></div></div></td>
          <td class="num" data-label="Towns">${r.townCount}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ============================= ADMIN UPLOAD ============================= */
function setAdminUploadTab(t){ state.adminUploadTab=t; state.adminUploadResult=null; render(); }
function renderAdminUpload(){
  const tab = state.adminUploadTab;
  return `
  <div class="tabs" style="margin-bottom:18px;">
    <button class="tab ${tab==='target'?'active':''}" onclick="setAdminUploadTab('target')">Target Upload</button>
    <button class="tab ${tab==='achievement'?'active':''}" onclick="setAdminUploadTab('achievement')">Achievement Workbook</button>
    <button class="tab ${tab==='stock'?'active':''}" onclick="setAdminUploadTab('stock')">Opening Stock</button>
  </div>
  ${tab==='target' ? renderTargetUploadPanel() : tab==='achievement' ? renderAchievementUploadPanel() : renderStockUploadPanel()}
  `;
}

function renderTargetUploadPanel(){
  const result = state.adminUploadResult;
  return `
  <div class="panel">
    <h3>Upload Family-wise Target</h3>
    <div class="row-flex" style="margin-bottom:14px;">
      <div class="field">
        <label>Month</label>
        <input id="targetMonthInput" type="text" value="${state.adminTargetMonth}" placeholder="YYYY-MM" onchange="state.adminTargetMonth=this.value">
      </div>
      <div class="field">
        <label>Town</label>
        <select id="targetTownInput">
          ${ALL_TOWNS.map(t=>`<option value="${esc(t)}" ${state.adminTargetTown===t?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
      </div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">Paste one family per line as <code style="background:#EEF0F4;padding:1px 6px;border-radius:4px;">Family, Target Qty</code> — matches your territory target sheet's Item Description/family column and monthly qty. Uploading again for the same family/town/month overwrites the previous value.</p>
    <textarea id="targetPasteInput" rows="8" placeholder="Ink F Pen 15ml, 2082
Ink F Pen 30ml, 2377
Ball Pen BP-1, 5400" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;"></textarea>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="handleTargetUpload()">Upload Target</button>
    ${result && result.kind==='target' ? renderUploadResultBox(result) : ''}
  </div>`;
}
async function handleTargetUpload(){
  const month = document.getElementById('targetMonthInput').value.trim();
  const town = document.getElementById('targetTownInput').value;
  const text = document.getElementById('targetPasteInput').value;
  if(!month || !text.trim()){ alert('Enter a month and paste at least one line.'); return; }
  const res = await uploadTargetBulk(month, town, text);
  state.adminTargetMonth = month; state.adminTargetTown = town;
  state.adminUploadResult = {kind:'target', ...res};
  render();
}

function renderAchievementUploadPanel(){
  const result = state.adminUploadResult;
  return `
  <div class="panel">
    <h3>Upload Achievement Workbook</h3>
    <div class="row-flex" style="margin-bottom:14px;">
      <div class="field">
        <label>Month</label>
        <input id="achMonthInput" type="text" value="${state.adminAchMonth}" placeholder="YYYY-MM" onchange="state.adminAchMonth=this.value">
      </div>
      <div class="field">
        <label>Type</label>
        <select id="achTypeInput" onchange="state.adminAchType=this.value">
          <option value="primary" ${state.adminAchType==='primary'?'selected':''}>Primary</option>
          <option value="secondary" ${state.adminAchType==='secondary'?'selected':''}>Secondary</option>
        </select>
      </div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">
      Upload the full "Achievement vs Target" workbook exactly as your existing report is formatted — one sheet per town, SKU rows followed by a family subtotal row (same structure as the July file). All town sheets in the workbook are processed in one go; region-rollup sheets are skipped automatically.
    </p>
    <label class="upload-box" for="achFileInput">
      <div style="font-size:28px;margin-bottom:8px;">⬆</div>
      <div style="font-weight:600;">Click to choose the .xlsx workbook</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px;">Large files may take a minute to process — don't close the tab.</div>
      <input id="achFileInput" type="file" accept=".xlsx,.xls" onchange="handleAchievementUpload(this.files[0])">
    </label>
    <div id="achUploadStatus"></div>
    ${result && result.kind==='achievement' ? renderUploadResultBox(result) : ''}
  </div>`;
}
async function handleAchievementUpload(file){
  if(!file) return;
  const month = document.getElementById('achMonthInput').value.trim();
  const type = document.getElementById('achTypeInput').value;
  if(!month){ alert('Enter a month first.'); return; }
  document.getElementById('achUploadStatus').innerHTML = '<div class="loading">Processing workbook — this can take a minute for large files…</div>';
  try{
    const res = await uploadAchievementWorkbook(file, month, type);
    state.adminAchMonth = month; state.adminAchType = type;
    state.adminUploadResult = {kind:'achievement', ...res};
    render();
  }catch(e){
    document.getElementById('achUploadStatus').innerHTML = `<div class="err">Failed to process file: ${esc(e.message||String(e))}</div>`;
  }
}

function renderStockUploadPanel(){
  const result = state.adminUploadResult;
  return `
  <div class="panel">
    <h3>Upload Opening Stock (Family-wise)</h3>
    <div class="row-flex" style="margin-bottom:14px;">
      <div class="field">
        <label>Month (stock opening for)</label>
        <input id="stockMonthInput" type="text" value="${state.adminTargetMonth}" placeholder="YYYY-MM">
      </div>
      <div class="field">
        <label>Town</label>
        <select id="stockTownInput">
          ${ALL_TOWNS.map(t=>`<option value="${esc(t)}" ${state.adminTargetTown===t?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
      </div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">Paste one family per line as <code style="background:#EEF0F4;padding:1px 6px;border-radius:4px;">Family, Opening Stock Qty</code>. If FGS only gives you one company-wide figure per family (not per-town), upload the same number under every town for now.</p>
    <textarea id="stockPasteInput" rows="8" placeholder="Ink F Pen 15ml, 500
Ink F Pen 30ml, 1200" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;"></textarea>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="handleStockUpload()">Upload Stock</button>
    ${result && result.kind==='stock' ? renderUploadResultBox(result) : ''}
  </div>`;
}
async function handleStockUpload(){
  const month = document.getElementById('stockMonthInput').value.trim();
  const town = document.getElementById('stockTownInput').value;
  const text = document.getElementById('stockPasteInput').value;
  if(!month || !text.trim()){ alert('Enter a month and paste at least one line.'); return; }
  const res = await uploadStockBulk(month, town, text);
  state.adminUploadResult = {kind:'stock', ...res};
  render();
}

function renderUploadResultBox(r){
  if(!r.ok) return `<div class="err" style="margin-top:12px;">Upload failed: ${esc(r.error)}</div>`;
  let html = `<div style="margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--green-bg);font-size:12.5px;">`;
  if(r.kind==='achievement'){
    html += `<b>${r.sheetsProcessed} town sheets processed</b> — ${r.familyRows} family rows, ${r.skuRows} SKU rows upserted.`;
    if(r.townsUnmatched && r.townsUnmatched.length){
      html += `<div style="margin-top:6px;color:var(--amber);">${r.townsUnmatched.length} sheet(s) skipped — town name not recognized:<br>${r.townsUnmatched.map(esc).join('<br>')}</div>`;
    }
  } else {
    html += `<b>${r.count} row(s) updated.</b>`;
    if(r.unmatched && r.unmatched.length){
      html += `<div style="margin-top:6px;color:var(--amber);">${r.unmatched.length} line(s) couldn't be parsed:<br>${r.unmatched.map(esc).join('<br>')}</div>`;
    }
  }
  html += `</div>`;
  return html;
}

/* ============================= AUTO-REFRESH ON RESUME ============================= */
function refreshCurrentViewData(){
  if(!state.user) return;
  state.familyData=null; state.suggestedData=null; state.nsmFamilySummary=null; state.hierarchyData=null;
  render();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshCurrentViewData(); });
window.addEventListener('pageshow', (e)=>{ if(e.persisted) refreshCurrentViewData(); });

/* ============================= INIT ============================= */
restoreSession();
render();
</script>
</body>
</html>
